<meta name="theme-color" content="#E2481F">
<style>
  :root{
    --bg:#FBF6EF; --card:#FFFFFF; --ink:#2B2118; --muted:#7A6A5B; --line:#EADFD2;
    --brand:#E2481F; --brand-2:#F08A24; --ok:#2E7D4F; --warn:#B7791F; --bad:#B23B3B;
    --radius:16px; --shadow:0 2px 10px rgba(60,35,10,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:42px;height:52px;object-fit:contain;display:block}
  h1{font-size:20px;margin:0;line-height:1.15}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .lang button{border:0;background:none;padding:6px 10px;font-size:13px;color:var(--muted);cursor:pointer}
  .lang button.on{background:var(--ink);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
  .opt{font-weight:400;color:var(--muted)}
  input[type=text],input[type=tel],input[type=number],input[type=password],input[type=email],textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:0;border-color:transparent}
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0;padding-top:0}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:650}
  .item .pr{color:var(--muted);font-size:14px}
  .item .line{font-size:13px;color:var(--brand);font-weight:600;min-height:18px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stepper button{width:42px;height:44px;border:0;background:#F6EEE4;font-size:22px;color:var(--ink);cursor:pointer}
  .stepper button:active{background:#EBDDCB}
  .stepper input{width:52px;height:44px;border:0;text-align:center;font-weight:700;font-size:17px;padding:0;border-radius:0;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .tot{flex:1}
  .tot .q{font-size:13px;color:var(--muted)}
  .tot .c{font-size:22px;font-weight:800}
  .btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
  .inv-meta b{white-space:nowrap}
  .btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
  .btn.wa{background:#1F9D55}
  .btn.block{width:100%}
  .err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
  .notice{background:#FFF4E0;border:1px solid #F2D7A6;color:#7A4E0E;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .center{text-align:center}
  .big-check{width:64px;height:64px;border-radius:50%;background:#E3F3E9;color:var(--ok);display:grid;place-items:center;font-size:34px;margin:8px auto 10px}
  table.sum{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
  table.sum td{padding:6px 0;border-bottom:1px dashed var(--line)}
  table.sum td:last-child{text-align:right}
  table.sum tr.t td{border-bottom:0;font-weight:800;padding-top:10px}
  .hidden{display:none!important}
  /* admin */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tile .v{font-size:22px;font-weight:800;margin-top:2px}
  .tile .s{font-size:12px;color:var(--muted)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ord{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .ord .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .ord .nm{font-weight:700}
  .ord .meta{font-size:12px;color:var(--muted)}
  .ord .amt{font-weight:800;white-space:nowrap}
  .ord .lines{font-size:14px;margin:8px 0;color:#4A3B2E}
  .ord .acts{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip.paid{background:#E3F3E9;border-color:#BFE3CC;color:var(--ok);font-weight:650}
  .chip.done{background:#E8EEF9;border-color:#C6D4F0;color:#2A4F9A;font-weight:650}
  .chip.del{color:var(--bad)}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .empty{color:var(--muted);text-align:center;padding:24px 0}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  h2{font-size:16px;margin:0 0 10px}
  .muted{color:var(--muted);font-size:13px}
  .closed{opacity:.5;pointer-events:none}
  /* invoice */
  #vInvoice{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:16px}
  .inv-acts{max-width:640px;margin:0 auto 12px;display:flex;gap:8px}
  .inv{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 24px;color:#222}
  .inv-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:14px}
  .inv-h .ttl{font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--brand)}
  .inv-h .sel{font-weight:700;font-size:16px}
  .inv small,.inv .lbl{color:#777;font-size:12px}
  .inv-meta{display:flex;justify-content:space-between;gap:16px;margin:16px 0;font-size:14px}
  .inv-meta div{flex:1}
  .inv table{width:100%;border-collapse:collapse;font-size:14px}
  .inv th{text-align:left;background:#F6EEE4;padding:8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .inv td{padding:9px 8px;border-bottom:1px solid #eee;vertical-align:top}
  .inv .r{text-align:right;white-space:nowrap}
  .inv .grand td{font-weight:800;font-size:16px;border-bottom:0;border-top:2px solid #222}
  .stamp{display:inline-block;border:2px solid;border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:.08em;font-size:13px}
  .stamp.paid{color:var(--ok)} .stamp.unpaid{color:var(--bad)}
  .inv-foot{margin-top:18px;font-size:13px;color:#555}
  .pay{white-space:pre-line;background:#F6EEE4;border-radius:10px;padding:10px 12px;font-size:14px;color:#222;margin-top:6px;text-align:left}
  .pay b{font-size:16px;letter-spacing:.03em}
  @media print{
    @page{size:A5;margin:10mm}
    body>*:not(#vInvoice){display:none!important}
    html,body{background:#fff!important}
    #vInvoice{position:static;padding:0;background:#fff}
    .inv-acts{display:none}
    .inv{border:0;padding:0;max-width:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

let LANG = (()=>{try{return localStorage.getItem("kr_lang")||"id"}catch(e){return "id"}})();
const t = k => (T[LANG]&&T[LANG][k]) || T.id[k] || k;
const $ = id => document.getElementById(id);
const rp = n => "Rp " + new Intl.NumberFormat("id-ID").format(Math.round(n||0));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),1800)}

/* ---------- Store (Firebase or local demo) ---------- */
const DEMO = !CONFIG.firebase.apiKey;
const Store = (()=>{
  if (DEMO){
    const K="kr_demo_v1";
    const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{orders:{},settings:null}}catch(e){return {orders:{},settings:null}}};
    const save=d=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
    let subs=[], setSubs=[], authCb=null, user=null;
    const emit=()=>{const d=load();subs.forEach(f=>f(d.orders||{}))};
    const emitS=()=>{const d=load();setSubs.forEach(f=>f(d.settings))};
    return {
      onSettings(cb){setSubs.push(cb);cb(load().settings)},
      async saveSettings(s){const d=load();d.settings=s;save(d);emitS()},
      async addOrder(o){const d=load();const id="d"+Date.now().toString(36);o.createdAt=Date.now();d.orders[id]=o;save(d);emit();return id},
      onOrders(cb){subs.push(cb);cb(load().orders||{})},
      async updateOrder(id,p){const d=load();Object.assign(d.orders[id],p);save(d);emit()},
      async deleteOrder(id){const d=load();delete d.orders[id];save(d);emit()},
      onAuth(cb){authCb=cb;cb(user)},
      async signIn(){user={uid:"demo"};authCb&&authCb(user)},
      async signOut(){user=null;authCb&&authCb(null)}
    };
  }
  firebase.initializeApp(CONFIG.firebase);
  const db=firebase.database(), auth=firebase.auth(), R=CONFIG.dbRoot;
  return {
    onSettings(cb){db.ref(R+"/settings").on("value",s=>cb(s.val()),()=>cb(null))},
    saveSettings(s){return db.ref(R+"/settings").set(s)},
    async addOrder(o){o.createdAt=firebase.database.ServerValue.TIMESTAMP;const r=db.ref(R+"/orders").push();await r.set(o);return r.key},
    onOrders(cb){db.ref(R+"/orders").on("value",s=>cb(s.val()||{}),e=>{console.error(e);cb({})})},
    updateOrder(id,p){return db.ref(R+"/orders/"+id).update(p)},
    deleteOrder(id){return db.ref(R+"/orders/"+id).remove()},
    onAuth(cb){auth.onAuthStateChanged(cb)},
    signIn(e,p){return auth.signInWithEmailAndPassword(e,p)},
    signOut(){return auth.signOut()}
  };
})();

/* ---------- Order form ---------- */
function renderItems(){
  $("items").innerHTML = CONFIG.items.map(i=>`
    <div class="item">
      <div class="info">
        <div class="nm">${esc(i.name)}</div>
        <div class="pr">${rp(price(i.id))} / ${esc(i.unit[LANG]||i.unit.id)}</div>
        <div class="line" id="ln_${i.id}"></div>
      </div>
      <div class="stepper">
        <button type="button" aria-label="-" data-d="-1" data-i="${i.id}">−</button>
        <input type="number" inputmode="numeric" min="0" max="${CONFIG.maxQtyPerItem}" value="${qty[i.id]||0}" id="q_${i.id}" aria-label="${esc(i.name)}">
        <button type="button" aria-label="+" data-d="1" data-i="${i.id}">+</button>
      </div>
    </div>`).join("");
  $("items").querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>setQty(b.dataset.i,(qty[b.dataset.i]||0)+Number(b.dataset.d)));
  CONFIG.items.forEach(i=>{
    const inp=$("q_"+i.id);
    inp.oninput=()=>setQty(i.id,inp.value,true);
    inp.onfocus=()=>inp.select();
  });
}
function setQty(id,v,fromInput){
  let n=parseInt(v,10); if(isNaN(n)||n<0)n=0; if(n>CONFIG.maxQtyPerItem)n=CONFIG.maxQtyPerItem;
  qty[id]=n; if(!fromInput||String(n)!==$("q_"+id).value&&$("q_"+id).value!=="") $("q_"+id).value=n;
  $("eQty").textContent=""; renderTotals();
}
function totals(){
  let q=0,c=0; CONFIG.items.forEach(i=>{q+=qty[i.id];c+=qty[i.id]*price(i.id)}); return {q,c};
}
function renderTotals(){
  CONFIG.items.forEach(i=>{const el=$("ln_"+i.id); if(el) el.textContent = qty[i.id]? `${qty[i.id]} × ${rp(price(i.id))} = ${rp(qty[i.id]*price(i.id))}` : ""});
  const {q,c}=totals(); $("tQty").textContent=q; $("tCost").textContent=rp(c);
}
function applyOpen(){
  const closed = SETTINGS.open===false && !IS_ADMIN;
  $("closedNote").textContent=t("closed"); $("closedNote").classList.toggle("hidden",!closed);
  $("orderForm").classList.toggle("closed",closed); $("submitBtn").disabled=closed;
}
$("fName").oninput=()=>$("eName").textContent="";

$("orderForm").onsubmit = async e=>{
  e.preventDefault();
  const name=$("fName").value.trim(), {q,c}=totals(); let ok=true;
  if(!name){$("eName").textContent=t("errName");ok=false}
  if(q<1){$("eQty").textContent=t("errQty");ok=false}
  if(!ok){(name?$("itemsCard"):$("fName")).scrollIntoView({behavior:"smooth",block:"center"});return}
  const items={}; CONFIG.items.forEach(i=>{ if(qty[i.id]>0) items[i.id]={name:i.name,qty:qty[i.id],price:price(i.id)} });
  const order={name,wa:$("fWa").value.trim(),note:$("fNote").value.trim(),items,totalQty:q,totalCost:c,paid:false,done:false,lang:LANG};
  const btn=$("submitBtn"); btn.disabled=true; btn.textContent=t("sending");
  try{
    const id=await Store.addOrder(order);
    showDone(id,order);
  }catch(err){console.error(err);toast(t("errSend"))}
  finally{btn.disabled=false;btn.textContent=t("submit")}
};
const orderNo = (id,createdAt) => "K-" + String(id).slice(-5).toUpperCase();

let LAST=null;
function showDone(id,o){
  const no=orderNo(id); LAST={id,...o,createdAt:typeof o.createdAt==="number"?o.createdAt:Date.now()};
  $("dNo").textContent=no;
  $("dSum").innerHTML = Object.values(o.items).map(it=>`<tr><td>${esc(it.name)}<br><span class="muted">${it.qty} × ${rp(it.price)}</span></td><td>${rp(it.qty*it.price)}</td></tr>`).join("")
    + `<tr class="t"><td>${t("total")} (${o.totalQty})</td><td>${rp(o.totalCost)}</td></tr>`;
  const wa=(SETTINGS.sellerWa||"").replace(/\D/g,"");
  if(wa){
    const lines=Object.values(o.items).map(it=>`- ${it.name}: ${it.qty}`).join("\n");
    const msg=`${t("waMsg")} (${no})\n${t("name")}: ${o.name}\n${lines}\n${t("totalQty")}: ${o.totalQty}\n${t("total")}: ${rp(o.totalCost)}`;
    $("dWa").href="https://wa.me/"+wa+"?text="+encodeURIComponent(msg); $("dWa").classList.remove("hidden");
  } else $("dWa").classList.add("hidden");
  if(CONFIG.invoice?.paymentInfo){ $("dPayTxt").innerHTML=payHtml()+"\n<b>"+rp(o.totalCost)+"</b>"; $("dPay").classList.remove("hidden") }
  $("vOrder").classList.add("hidden"); $("bar").classList.add("hidden"); $("vDone").classList.remove("hidden");
  window.scrollTo(0,0);
}
$("dAgain").onclick=()=>{
  CONFIG.items.forEach(i=>qty[i.id]=0); $("fNote").value="";
  renderItems(); renderTotals();
  $("vDone").classList.add("hidden"); $("vOrder").classList.remove("hidden"); $("bar").classList.remove("hidden");
};

/* ---------- Settings sync ---------- */

  renderItems(); renderTotals(); applyOpen(); if(IS_ADMIN) fillSettings();
});

/* ---------- Admin ---------- */
let ORDERS={}, FILTER="all", USER=null;
function initAdmin(){
  $("vOrder").classList.add("hidden"); $("bar").classList.add("hidden");
  Store.onAuth(u=>{
    USER=u;
    $("vLogin").classList.toggle("hidden",!!u); $("vAdmin").classList.toggle("hidden",!u);
    if(u && !initAdmin.sub){ initAdmin.sub=true; Store.onOrders(o=>{ORDERS=o||{};renderAdmin()}) }
  });
  $("lBtn").onclick=async()=>{
    $("eLogin").textContent="";
    try{await Store.signIn($("lEmail").value.trim(),$("lPass").value)}catch(e){$("eLogin").textContent=t("loginErr")}
  };
  $("lPass").onkeydown=e=>{if(e.key==="Enter")$("lBtn").click()};
  $("aLogout").onclick=()=>Store.signOut();
  $("aSetBtn").onclick=()=>{$("aSettings").classList.toggle("hidden");fillSettings()};
  $("aSearch").oninput=renderOrders;
  $("aCsv").onclick=exportCsv;
  $("sSave").onclick=async()=>{
    const prices={}; CONFIG.items.forEach(i=>{const v=parseInt($("sp_"+i.id).value,10); prices[i.id]=isNaN(v)||v<0?price(i.id):v});
    try{await Store.saveSettings({prices,open:$("sOpen").checked,sellerWa:$("sWa").value.replace(/\D/g,"")});toast(t("saved"));$("aSettings").classList.add("hidden")}
    catch(e){console.error(e);toast(t("errSend"))}

}
function fillSettings(){
  if(!$("sPrices")) return;
  $("sPrices").innerHTML = CONFIG.items.map(i=>`<div class="field"><label for="sp_${i.id}">${t("price")} — ${esc(i.name)} (Rp)</label>
     <input id="sp_${i.id}" type="number" inputmode="numeric" min="0" step="500" value="${price(i.id)}"></div>`).join("");
  $("sWa").value = SETTINGS.sellerWa||""; $("sOpen").checked = SETTINGS.open!==false;
}
const list = () => Object.entries(ORDERS).map(([id,o])=>({id,...o})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
function renderAdmin(){
  if(!IS_ADMIN) return;
  const all=list();
  const per={}; CONFIG.items.forEach(i=>per[i.id]=0);
  let tq=0,tc=0,pc=0;
  all.forEach(o=>{tq+=o.totalQty||0;tc+=o.totalCost||0;if(o.paid)pc+=o.totalCost||0;
    Object.entries(o.items||{}).forEach(([k,v])=>{if(per[k]!=null)per[k]+=v.qty||0})});
  $("tiles").innerHTML =
    `<div class="tile"><div class="k">${t("orders")}</div><div class="v">${all.length}</div><div class="s">${t("totalQty")}: ${tq}</div></div>
     <div class="tile"><div class="k">${t("revenue")}</div><div class="v">${rp(tc)}</div><div class="s">${rp(pc)} ${t("paidRev")}</div></div>` +
    CONFIG.items.map(i=>`<div class="tile"><div class="k">${esc(i.name)}</div><div class="v">${per[i.id]}</div><div class="s">${rp(per[i.id]*price(i.id))}</div></div>`).join("");
  const counts={all:all.length,unpaid:all.filter(o=>!o.paid).length,paid:all.filter(o=>o.paid).length,open:all.filter(o=>!o.done).length,done:all.filter(o=>o.done).length};
  $("tabs").innerHTML = ["all","unpaid","paid","open","done"].map(f=>`<button data-f="${f}" class="${FILTER===f?"on":""}">${t(f)} (${counts[f]})</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;renderAdmin()});
  renderOrders();
}
function renderOrders(){
  const q=($("aSearch").value||"").toLowerCase();
  const rows=list().filter(o=>{
    if(FILTER==="unpaid"&&o.paid)return false; if(FILTER==="paid"&&!o.paid)return false;
    if(FILTER==="open"&&o.done)return false; if(FILTER==="done"&&!o.done)return false;
    return !q || (o.name||"").toLowerCase().includes(q) || orderNo(o.id).toLowerCase().includes(q);
  });
  if(!rows.length){$("orders").innerHTML=`<div class="empty">${t("noOrders")}</div>`;return}
  const fmt=new Intl.DateTimeFormat(LANG==="id"?"id-ID":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  $("orders").innerHTML = rows.map(o=>{
    const wa=(o.wa||"").replace(/\D/g,"").replace(/^0/,"62");
    return `<div class="ord">
      <div class="top">
        <div><div class="nm">${esc(o.name)}</div>
          <div class="meta">${orderNo(o.id)} · ${o.createdAt?fmt.format(new Date(o.createdAt)):""}${wa?` · <a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(o.wa)}</a>`:""}</div></div>
        <div class="amt">${rp(o.totalCost)}</div>
      </div>
      <div class="lines">${Object.values(o.items||{}).map(it=>`${esc(it.name)}: <b>${it.qty}</b>`).join(" · ")} · ${t("totalQty")}: <b>${o.totalQty}</b>
        ${o.note?`<div class="muted" style="margin-top:4px">“${esc(o.note)}”</div>`:""}</div>
      <div class="acts">
        <button class="chip ${o.paid?"paid":""}" data-a="paid" data-id="${o.id}">${o.paid?"✓ "+t("paid"):t("unpaid")}</button>
        <button class="chip ${o.done?"done":""}" data-a="done" data-id="${o.id}">${o.done?"✓ "+t("done"):t("open")}</button>
        <button class="chip" data-a="inv" data-id="${o.id}">🧾 Invoice</button>
        <button class="chip del" data-a="del" data-id="${o.id}">${t("del")}</button>
      </div></div>`}).join("");
  $("orders").querySelectorAll("button[data-a]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,o=ORDERS[id],a=b.dataset.a;
    try{
      if(a==="inv"){ showInvoice({id,...o}); return }
      if(a==="del"){ if(confirm(t("confirmDel"))) await Store.deleteOrder(id) }
      else await Store.updateOrder(id,{[a]:!o[a]});
    }catch(e){console.error(e);toast(t("errSend"))}
  });
}
function exportCsv(){
  const head=["Order No","Date","Name","WhatsApp",...CONFIG.items.map(i=>"Qty "+i.name),"Total Qty","Total Cost","Paid","Delivered","Note"];
  const rows=list().map(o=>[orderNo(o.id),o.createdAt?new Date(o.createdAt).toISOString().replace("T"," ").slice(0,16):"",o.name,o.wa,
    ...CONFIG.items.map(i=>o.items?.[i.id]?.qty||0),o.totalQty,o.totalCost,o.paid?"Y":"N",o.done?"Y":"N",o.note||""]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  a.download="orders-keripik-"+new Date().toISOString().slice(0,10)+".csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

const payHtml = () => esc(CONFIG.invoice?.paymentInfo||"").replace(/(\d{6,})/g,"<b>$1</b>");
const invNo = o => { const d=new Date(o.createdAt||Date.now());
  return "INV-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(o.id).slice(-5).toUpperCase() };
let INV=null;
function showInvoice(o){
  INV=o; const I=CONFIG.invoice||{};
  const d=new Date(o.createdAt||Date.now());
  const dt=new Intl.DateTimeFormat(LANG==="id"?"id-ID":"en-GB",{day:"numeric",month:"long",year:"numeric"}).format(d);
  const its=Object.values(o.items||{});
  $("inv").innerHTML = `
    <div class="inv-h">
      <div><img src="${LOGO_FULL}" alt="${esc(I.sellerName||CONFIG.shopName)}" style="height:92px;display:block;margin-bottom:6px">
        ${I.sellerAddress?`<small>${esc(I.sellerAddress)}</small><br>`:""}
        ${SETTINGS.sellerWa?`<small>WA: +${esc(SETTINGS.sellerWa)}</small>`:""}</div>
      <div style="text-align:right"><div class="ttl">${t("invoice")}</div>
        <span class="stamp ${o.paid?"paid":"unpaid"}">${o.paid?t("paidStamp"):t("unpaidStamp")}</span></div>
    </div>
    <div class="inv-meta">
      <div><div class="lbl">${t("billTo")}</div><b>${esc(o.name)}</b>${o.wa?`<br>${esc(o.wa)}`:""}</div>
      <div style="text-align:right"><div class="lbl">${t("invNo")}</div><b>${invNo(o)}</b>
        <div class="lbl" style="margin-top:6px">${t("date")}</div>${dt}</div>
    </div>
    <table>
      <thead><tr><th>${t("product")}</th><th class="r">${t("qty")}</th><th class="r">${t("unitPrice")}</th><th class="r">${t("subtotal")}</th></tr></thead>
      <tbody>${its.map(it=>`<tr><td>${esc(it.name)}</td><td class="r">${it.qty}</td><td class="r">${rp(it.price)}</td><td class="r">${rp(it.qty*it.price)}</td></tr>`).join("")}</tbody>
      <tfoot><tr class="grand"><td>${t("total")}</td><td class="r">${o.totalQty}</td><td></td><td class="r">${rp(o.totalCost)}</td></tr></tfoot>
    </table>
    ${o.note?`<p class="inv-foot"><span class="lbl">${t("note")}:</span> ${esc(o.note)}</p>`:""}
    ${I.paymentInfo?`<div class="inv-foot"><div class="lbl">${t("payment")}</div><div class="pay">${payHtml()}</div></div>`:""}
    <p class="inv-foot" style="text-align:center;margin-top:22px">${esc((I.footer&&(I.footer[LANG]||I.footer.id))||"")}</p>`;
  // WhatsApp share: admin → buyer's number; buyer → seller's number
  const target = IS_ADMIN ? (o.wa||"").replace(/\D/g,"").replace(/^0/,"62") : (SETTINGS.sellerWa||"").replace(/\D/g,"");
  if(target){
    const msg=`*${t("invWa")} ${invNo(o)}*\n${t("date")}: ${dt}\n${t("billTo")}: ${o.name}\n\n`
      + its.map(it=>`${it.name}\n  ${it.qty} x ${rp(it.price)} = ${rp(it.qty*it.price)}`).join("\n")
      + `\n\n${t("totalQty")}: ${o.totalQty}\n*${t("total")}: ${rp(o.totalCost)}*\n${t("status")}: ${o.paid?t("paidStamp"):t("unpaidStamp")}`
      + (I.paymentInfo?`\n\n${t("payment")}: ${I.paymentInfo}`:"");
    $("iWa").href="https://wa.me/"+target+"?text="+encodeURIComponent(msg); $("iWa").classList.remove("hidden");
  } else $("iWa").classList.add("hidden");
  $("vInvoice").classList.remove("hidden"); document.title=invNo(o); $("vInvoice").scrollTop=0;
}
$("iClose").onclick=()=>{$("vInvoice").classList.add("hidden");document.title=CONFIG.shopName;INV=null};
$("iPrint").onclick=()=>window.print();
$("dInv").onclick=()=>LAST&&showInvoice(LAST);

/* ---------- Boot ---------- */
if(IS_ADMIN) initAdmin();
applyLang();
</script>
</body>
</html>
